<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recruiter Dashboard - Career Mate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-gray-50 min-h-screen">
    <div class="flex">
      <aside class="w-64 bg-white shadow-lg min-h-screen sticky top-0">
        <div class="p-6">
          <a
            href="Homepage.html"
            class="text-2xl font-bold text-green-600 block mb-8"
            >Career Mate</a
          >

          <div class="mb-8 p-4 bg-green-50 rounded-xl">
            <div
              id="userAvatar"
              class="w-16 h-16 rounded-full bg-gradient-to-r from-green-500 to-blue-500 mx-auto mb-3 flex items-center justify-center text-white font-bold text-xl"
            >
              U
            </div>
            <h3 id="recruiterName" class="text-center font-bold text-gray-800">
              Đang tải...
            </h3>
            <p
              id="recruiterEmail"
              class="text-center text-xs text-gray-500 truncate"
            >
              ...
            </p>
          </div>

          <nav class="space-y-2">
            <a
              href="Recruiterdashboard.html"
              class="flex items-center p-3 text-green-600 bg-green-50 rounded-lg font-medium"
            >
              <i class="fas fa-tachometer-alt w-6 mr-3"></i> Tổng quan
            </a>
            <a
              href="Formpostjob.html"
              class="flex items-center p-3 text-gray-600 hover:text-green-600 hover:bg-green-50 rounded-lg"
            >
              <i class="fas fa-plus-circle w-6 mr-3"></i> Đăng việc mới
            </a>
            <a
              href="Findjobs.html"
              class="flex items-center p-3 text-gray-600 hover:text-green-600 hover:bg-green-50 rounded-lg"
            >
              <i class="fas fa-briefcase w-6 mr-3"></i> Xem tin tuyển dụng
            </a>
            <a
              href="Viewcandidate.html"
              class="flex items-center p-3 text-gray-600 hover:text-green-600 hover:bg-green-50 rounded-lg"
            >
              <i class="fas fa-users w-6 mr-3"></i> Quản lý ứng viên
            </a>
          </nav>
        </div>
      </aside>

      <main class="flex-1 p-8">
        <div class="flex justify-between items-center mb-8">
          <h1 class="text-2xl font-bold text-gray-800">Bảng điều khiển</h1>
          <button onclick="logout()" class="text-gray-500 hover:text-red-500">
            <i class="fas fa-sign-out-alt mr-2"></i>Đăng xuất
          </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
          <div
            class="bg-white rounded-xl shadow-sm p-6 border-l-4 border-green-500"
          >
            <p class="text-gray-500 text-sm">Tin đang tuyển</p>
            <p
              id="stat-active-jobs"
              class="text-3xl font-bold text-gray-800 mt-2"
            >
              0
            </p>
          </div>
          <div
            class="bg-white rounded-xl shadow-sm p-6 border-l-4 border-blue-500"
          >
            <p class="text-gray-500 text-sm">Tổng ứng viên</p>
            <p
              id="stat-total-apps"
              class="text-3xl font-bold text-gray-800 mt-2"
            >
              0
            </p>
          </div>
          <div
            class="bg-white rounded-xl shadow-sm p-6 border-l-4 border-orange-500"
          >
            <p class="text-gray-500 text-sm">Đang chờ duyệt</p>
            <p
              id="stat-pending-apps"
              class="text-3xl font-bold text-gray-800 mt-2"
            >
              0
            </p>
          </div>
          <div
            class="bg-white rounded-xl shadow-sm p-6 border-l-4 border-purple-500"
          >
            <p class="text-gray-500 text-sm">Đã chấp nhận</p>
            <p
              id="stat-accepted-apps"
              class="text-3xl font-bold text-gray-800 mt-2"
            >
              0
            </p>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
          <div class="lg:col-span-1 bg-white rounded-xl shadow-sm p-6">
            <div class="flex justify-between items-center mb-4">
              <h2 class="font-bold text-gray-800">Tin tuyển dụng gần đây</h2>
              <a
                href="Findjobs.html"
                class="text-xs text-green-600 hover:underline"
                >Tất cả</a
              >
            </div>
            <div id="active-jobs-list" class="space-y-4">
              <p class="text-center text-gray-400 py-4">Đang tải...</p>
            </div>
          </div>

          <div class="lg:col-span-2 bg-white rounded-xl shadow-sm p-6">
            <div class="flex justify-between items-center mb-4">
              <h2 class="font-bold text-gray-800">Ứng tuyển gần đây</h2>
              <a
                href="Viewcandidate.html"
                class="text-xs text-green-600 hover:underline"
                >Xem chi tiết</a
              >
            </div>
            <div class="overflow-x-auto">
              <table class="w-full">
                <thead>
                  <tr class="text-left text-gray-500 text-sm border-b">
                    <th class="pb-3">Ứng viên</th>
                    <th class="pb-3">Vị trí</th>
                    <th class="pb-3 text-center">Trạng thái</th>
                  </tr>
                </thead>
                <tbody id="recent-apps-list"></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script>
      const API_BASE = "http://127.0.0.1:8000/api";

      document.addEventListener("DOMContentLoaded", function () {
        const token = sessionStorage.getItem("access_token"); // ← đổi
        const email = localStorage.getItem("user_email");
        const role = localStorage.getItem("user_role");

        if (!token || role !== "recruiter") {
          window.location.href = "../auth/login.html";
          return;
        }

        // Hiển thị Profile
        const displayName = email.split("@")[0].toUpperCase();
        document.getElementById("recruiterName").textContent = displayName;
        document.getElementById("recruiterEmail").textContent = email;
        document.getElementById("userAvatar").textContent =
          displayName.substring(0, 1);

        // 1. Tải Thống kê
        async function fetchStats() {
          try {
            const res = await fetch(`${API_BASE}/recruiter/stats`, {
              headers: { Authorization: `Bearer ${token}` },
            });
            if (res.ok) {
              const data = await res.json();
              document.getElementById("stat-active-jobs").textContent =
                data.jobs.active;
              document.getElementById("stat-total-apps").textContent =
                data.applications.total;
              document.getElementById("stat-pending-apps").textContent =
                data.applications.pending;
              document.getElementById("stat-accepted-apps").textContent =
                data.applications.accepted;
            }
          } catch (e) {
            console.error("Stats Error:", e);
          }
        }

        // 2. Tải Job đang hoạt động
        async function fetchJobs() {
          try {
            const res = await fetch(
              `${API_BASE}/recruiter/jobs?status_filter=active&limit=3`,
              {
                headers: { Authorization: `Bearer ${token}` },
              },
            );
            if (res.ok) {
              const jobs = await res.json();
              const container = document.getElementById("active-jobs-list");
              container.innerHTML = jobs.length
                ? jobs
                    .map(
                      (job) => `
                            <div class="border border-gray-100 rounded-lg p-3 hover:bg-gray-50 transition cursor-pointer" onclick="location.href='Jobdetailpage.html?id=${job.id}'">
                                <h3 class="font-semibold text-sm text-gray-800">${job.title}</h3>
                                <div class="flex justify-between mt-1 text-[10px] text-gray-500 uppercase">
                                    <span>📍 ${job.location}</span>
                                    <span class="text-green-600">${job.salary_range || "Thỏa thuận"}</span>
                                </div>
                            </div>
                        `,
                    )
                    .join("")
                : '<p class="text-center text-gray-400">Trống</p>';
            }
          } catch (e) {
            console.error("Jobs Error:", e);
          }
        }

        // 3. Tải Ứng tuyển gần đây
        async function fetchRecentApps() {
          try {
            const res = await fetch(`${API_BASE}/applications/get`, {
              headers: { Authorization: `Bearer ${token}` },
            });
            if (res.ok) {
              const apps = await res.json();
              const tbody = document.getElementById("recent-apps-list");
              // Chỉ lấy 5 đơn mới nhất
              const recent = apps.slice(0, 5);
              tbody.innerHTML = recent
                .map(
                  (app) => `
                            <tr class="border-b text-sm">
                                <td class="py-3 font-medium text-gray-700">${app.student_name || "Ứng viên #" + app.user_id}</td>
                                <td class="py-3 text-gray-500 truncate max-w-[150px]">${app.job_title || "N/A"}</td>
                                <td class="py-3 text-center">
                                    <span class="px-2 py-1 rounded-full text-[9px] font-bold ${getStatusClass(app.status)}">
                                        ${app.status}
                                    </span>
                                </td>
                            </tr>
                        `,
                )
                .join("");
            }
          } catch (e) {
            console.error("Apps Error:", e);
          }
        }

        function getStatusClass(status) {
          if (status === "ACCEPTED") return "bg-green-100 text-green-700";
          if (status === "REJECTED") return "bg-red-100 text-red-700";
          return "bg-yellow-100 text-yellow-700";
        }

        // Gọi các hàm
        fetchStats();
        fetchJobs();
        fetchRecentApps();
      });

      function logout() {
        localStorage.clear();
        window.location.href = "../auth/login.html";
      }
    </script>
  </body>
</html>
