
services:
  db:
    image: mysql:8.0
    container_name: careermate_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 106006
      MYSQL_DATABASE: careermate_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: 106006
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u app_user -p106006"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - careermate_network

  redis:
    image: redis:7-alpine
    container_name: careermate_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - careermate_network

  backend:
    build:
      context: .              # ← SỬA: . thay vì ./server
      dockerfile: Dockerfile
    container_name: careermate_backend
    restart: unless-stopped
    env_file:
      - .env                  # ← SỬA: .env thay vì ./server/.env
    environment:
      - DATABASE_URL=mysql+pymysql://app_user:106006@db:3306/careermate_db
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - .:/app                # ← SỬA: . thay vì ./server
      - ../uploads:/app/uploads
        # - .alembic.ini:/app/alembic.ini:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - careermate_network
    command: >
      sh -c "
        echo '⏳ Waiting for database...' &&
        sleep 5 &&
        echo '📁 Checking alembic.ini...' &&
        ls -la /app/alembic.ini &&
        echo '🔄 Running migrations...' &&
        alembic upgrade head &&
        echo '✅ Migrations completed!' &&
        echo '🚀 Starting server...' &&
        uvicorn main:app --host 0.0.0.0 --port 8000 --reload
      "

volumes:
  mysql_data:
  redis_data:

networks:
  careermate_network:
    driver: bridge
