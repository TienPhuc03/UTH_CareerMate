<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách ứng viên - Career Mate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen">
    <div id="header-placeholder"></div>

    <main class="max-w-[1200px] mx-auto py-10 px-4">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Danh sách ứng viên ứng tuyển</h1>
                <p class="text-gray-600">Quản lý các hồ sơ đã nộp vào các vị trí đăng tuyển của bạn</p>
            </div>
            <div class="flex gap-3">
                <span class="bg-sky-100 text-sky-700 px-4 py-2 rounded-full text-sm font-semibold">
                    Tổng cộng: <span id="candidate-count">0</span> ứng viên
                </span>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 border-b border-gray-200">
                        <th class="px-6 py-4 text-sm font-bold text-gray-700">Ứng viên</th>
                        <th class="px-6 py-4 text-sm font-bold text-gray-700">Vị trí ứng tuyển</th>
                        <th class="px-6 py-4 text-sm font-bold text-gray-700">Ngày nộp</th>
                        <th class="px-6 py-4 text-sm font-bold text-gray-700">Trạng thái</th>
                        <th class="px-6 py-4 text-sm font-bold text-gray-700 text-center">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="candidate-list">
                    <tr class="border-b border-gray-100 hover:bg-gray-50 transition">
                        <td class="px-6 py-4">
                            <div class="flex items-center">
                                <div class="w-10 h-10 rounded-full bg-emerald-500 flex items-center justify-center text-white font-bold mr-3">
                                    NV
                                </div>
                                <div>
                                    <p class="font-bold text-gray-800">Nguyễn Văn A</p>
                                    <p class="text-xs text-gray-500">nguyenvana@gmail.com</p>
                                </div>
                            </div>
                        </td>
                        <td class="px-6 py-4 text-sm text-gray-700 font-medium">Frontend Developer</td>
                        <td class="px-6 py-4 text-sm text-gray-600">01/02/2026</td>
                        <td class="px-6 py-4">
                            <span class="px-3 py-1 bg-yellow-100 text-yellow-700 rounded-full text-xs font-bold">Chờ duyệt</span>
                        </td>
                        <td class="px-6 py-4 text-center">
                            <button class="text-sky-600 hover:text-sky-800 font-bold text-sm mr-3">Xem CV</button>
                            <button class="text-green-600 hover:text-green-800 font-bold text-sm">Duyệt</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="../components/auth-script.js"></script>
    <script>
        // Nạp Header
        fetch('../components/header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
                // Sau khi nạp header, chạy lại auth-script để xử lý menu theo role
                if (typeof initEvents === 'function') initEvents();
            });

        // Kiểm tra quyền truy cập
        document.addEventListener('DOMContentLoaded', function() {
            const role = localStorage.getItem('user_role');
            if (role !== 'recruiter') {
                alert("Bạn không có quyền truy cập trang này!");
                window.location.href = "Homepage.html";
            }
        });
    </script>
</body>
</html>
