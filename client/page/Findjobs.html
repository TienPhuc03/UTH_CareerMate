<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tìm kiếm công việc mơ ước" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <title>Tìm việc làm - Career Mate</title>
    <style>
      .job-card {
        transition: all 0.3s ease;
      }
      .job-card:hover {
        transform: translateY(-5px);
      }
      .salary-badge {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      }
    </style>
  </head>
  <body class="bg-gray-50 min-h-screen">
    <div id="header-container"></div>
   
    <!-- Hero Section -->
    <section
      class="bg-gradient-to-r from-green-500 to-green-600 text-white py-16"
    >
      <div class="max-w-[1200px] mx-auto px-4">
        <div class="text-center mb-8">
          <h1 class="text-4xl md:text-5xl font-bold mb-4">
            Tìm việc làm IT mơ ước
          </h1>
          <p class="text-xl text-green-100">
            Khám phá <span class="font-bold text-white">2,000+</span> cơ hội
            nghề nghiệp đang chờ bạn
          </p>
        </div>

        <!-- Search Bar -->
        <div class="max-w-4xl mx-auto">
          <div class="bg-white rounded-2xl shadow-2xl p-3">
            <div class="flex flex-col md:flex-row gap-3">
              <div
                class="flex-1 flex items-center bg-gray-50 rounded-lg px-4 py-3"
              >
                <i class="fas fa-search text-gray-400 mr-3"></i>
                <input
                  type="text"
                  id="keywordSearch"
                  placeholder="Vị trí, kỹ năng, công ty..."
                  class="bg-transparent w-full outline-none text-gray-700"
                />
              </div>
              <div
                class="flex-1 flex items-center bg-gray-50 rounded-lg px-4 py-3"
              >
                <i class="fas fa-map-marker-alt text-gray-400 mr-3"></i>
                <input
                  type="text"
                  id="locationSearch"
                  placeholder="Thành phố, khu vực..."
                  class="bg-transparent w-full outline-none text-gray-700"
                />
              </div>
              <button
                onclick="searchJobs()"
                class="bg-green-600 text-white px-8 py-3 rounded-lg font-bold hover:bg-green-700 transition shadow-lg"
              >
                Tìm kiếm
              </button>
            </div>
          </div>
        </div>

        <!-- Quick Filters -->
        <div class="max-w-4xl mx-auto mt-6 flex flex-wrap gap-3 justify-center">
          <button
            onclick="filterJobs('all')"
            class="filter-tag px-6 py-2 bg-white/20 backdrop-blur-sm text-white rounded-full hover:bg-white/30 transition border border-white/30"
          >
            Tất cả
          </button>
          <button
            onclick="filterJobs('remote')"
            class="filter-tag px-6 py-2 bg-white/20 backdrop-blur-sm text-white rounded-full hover:bg-white/30 transition border border-white/30"
          >
            <i class="fas fa-home mr-2"></i> Remote
          </button>
          <button
            onclick="filterJobs('hcmc')"
            class="filter-tag px-6 py-2 bg-white/20 backdrop-blur-sm text-white rounded-full hover:bg-white/30 transition border border-white/30"
          >
            <i class="fas fa-building mr-2"></i> TP.HCM
          </button>
          <button
            onclick="filterJobs('hanoi')"
            class="filter-tag px-6 py-2 bg-white/20 backdrop-blur-sm text-white rounded-full hover:bg-white/30 transition border border-white/30"
          >
            <i class="fas fa-building mr-2"></i> Hà Nội
          </button>
          <button
            onclick="filterJobs('tech')"
            class="filter-tag px-6 py-2 bg-white/20 backdrop-blur-sm text-white rounded-full hover:bg-white/30 transition border border-white/30"
          >
            <i class="fas fa-code mr-2"></i> IT
          </button>
        </div>
      </div>
    </section>

    <!-- Jobs Section -->
    <section class="max-w-[1200px] mx-auto px-4 py-12">
      <!-- Stats Bar -->
      <div class="bg-white rounded-xl shadow-md p-6 mb-8">
        <div class="flex flex-wrap items-center justify-between gap-4">
          <div>
            <h2 class="text-2xl font-bold text-gray-800">
              Việc làm IT hấp dẫn
            </h2>
            <p class="text-gray-600">
              Tìm thấy
              <span id="jobCount" class="font-bold text-green-600">6</span> việc
              làm phù hợp
            </p>
          </div>
          <div class="flex gap-3">
            <select
              class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
            >
              <option>Mới nhất</option>
              <option>Lương cao nhất</option>
              <option>Phù hợp nhất</option>
            </select>
          </div>
        </div>
      </div>
      <div id="job-container" class="space-y-6">
       <div class="text-center py-10">
         <i class="fas fa-spinner fa-spin text-3xl text-green-500"></i>
         <p class="mt-2 text-gray-500">Đang tải danh sách việc làm...</p>
       </div>
      </div>

      <!-- Jobs Grid -->
      
    </section>
     <div id ="footer-container"></div>
     <script>
        // Load header
        fetch('../components/header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-container').innerHTML = data;
                const script = document.createElement('script');
                script.src = '../components/auth-script.js';
                document.body.appendChild(script);
            });

        // Load footer
        fetch('../components/footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-container').innerHTML = data;
            });
    </script>

    <script>
  // --- BIẾN TOÀN CỤC LƯU TRỮ DANH SÁCH JOB ---
  let allJobs = [];

  // --- HÀM 1: NẠP DỮ LIỆU TỪ SERVER (THÊM MỚI) ---
  async function loadJobsFromServer() {
    try {
      const response = await fetch('http://127.0.0.1:8000/api/jobs/get');
      allJobs = await response.json();
      renderJobs(allJobs);
    } catch (error) {
      console.error("Lỗi khi kết nối server:", error);
      document.getElementById('job-container').innerHTML = `
        <p class="text-center text-red-500">Không thể kết nối đến máy chủ. Vui lòng thử lại sau!</p>`;
    }
  }

  // --- HÀM 2: HIỂN THỊ DỮ LIỆU RA HTML (THÊM MỚI) ---
  function renderJobs(jobs) {
    const container = document.getElementById('job-container');
    if (jobs.length === 0) {
        container.innerHTML = '<p class="text-center text-gray-500 py-10">Không tìm thấy việc làm phù hợp.</p>';
        document.getElementById("jobCount").textContent = 0;
        return;
    }

    container.innerHTML = jobs.map(job => {
        // Chuyển đổi mã location sang tên hiển thị
        const locationMap = {
    'hcm': 'TP. Hồ Chí Minh', 'hanoi': 'Hà Nội', 'danang': 'Đà Nẵng',
    'haiphong': 'Hải Phòng', 'longan': 'Long An', 'vungtau': 'Vũng Tàu',
    'cantho': 'Cần Thơ', 'dalat': 'Đà Lạt', 'nhatrang': 'Nha Trang',
    'phutho': 'Phú Thọ', 'quangninh': 'Quảng Ninh', 'quangnam': 'Quảng Nam',
    'hue': 'Huế', 'tayninh': 'Tây Ninh', 'binhthuan': 'Bình Thuận',
    'bienhoa': 'Biên Hòa', 'remote': 'Làm việc từ xa', 'hybrid': 'Hybrid'
};
        const displayLocation = locationMap[job.location] || job.location;

        // Chuyển đổi job_type sang tiếng Việt
        const typeMap = {
            'fulltime': 'Toàn thời gian', 'parttime': 'Bán thời gian', 'intern': 'Thực tập'
        };
        const displayType = typeMap[job.job_type] || job.job_type;

        return `
            <div class="job-card bg-white p-6 rounded-2xl shadow-sm border border-gray-100 hover:border-green-500 hover:shadow-md transition-all mb-4">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div class="flex gap-5">
                        <div class="w-16 h-16 bg-green-50 rounded-xl flex items-center justify-center text-green-600 text-2xl shadow-inner">
                            <i class="fas fa-building"></i>
                        </div>
                        
                        <div class="space-y-1">
                            <h3 class="text-xl font-bold text-gray-800 hover:text-green-600 transition-colors cursor-pointer">
                                ${job.title}
                            </h3>
                            <p class="text-gray-600 font-medium flex items-center">
                                <i class="far fa-hospital mr-2 text-gray-400"></i> ${job.company_name || 'Công ty tuyển dụng'}
                            </p>
                            
                            <div class="flex flex-wrap gap-y-2 gap-x-4 mt-3 text-sm">
                                <span class="flex items-center text-gray-500 bg-gray-50 px-3 py-1 rounded-full">
                                    <i class="fas fa-map-marker-alt mr-2 text-red-400"></i> ${displayLocation}
                                </span>
                                <span class="flex items-center text-gray-500 bg-gray-50 px-3 py-1 rounded-full">
                                    <i class="fas fa-briefcase mr-2 text-blue-400"></i> ${displayType}
                                </span>
                                <span class="flex items-center text-green-600 font-bold bg-green-50 px-3 py-1 rounded-full">
                                    <i class="fas fa-money-bill-wave mr-2"></i> ${job.salary_range}
                                </span>
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-col gap-3 w-full md:w-auto border-t md:border-t-0 pt-4 md:pt-0">
                        <a href="Jobdetailpage.html?id=${job.id}" 
                           class="inline-flex items-center justify-center bg-green-600 text-white px-8 py-2.5 rounded-xl font-bold hover:bg-green-700 transition-all shadow-lg shadow-green-200">
                            Xem chi tiết <i class="fas fa-arrow-right ml-2 text-xs"></i>
                        </a>
                    </div>
                </div>
            </div>
        `;
    }).join('');
    
    document.getElementById("jobCount").textContent = jobs.length;
}

  // --- HÀM 3: SỬA LẠI HÀM LỌC (CẬP NHẬT TỪ HÀM CŨ) ---
  function filterJobs(category) {
    if (category === "all") {
      renderJobs(allJobs);
    } else {
      const filtered = allJobs.filter(job => job.job_type === category);
      renderJobs(filtered);
    }
  }

  // --- HÀM 4: SỬA LẠI HÀM TÌM KIẾM (CẬP NHẬT TỪ HÀM CŨ) ---
  function searchJobs() {
    const location = document.getElementById("locationSearch").value.toLowerCase();
    const keyword = document.getElementById("keywordSearch").value.toLowerCase();

    const filtered = allJobs.filter(job => {
      const matchLocation = !location || job.location.toLowerCase().includes(location);
      const matchKeyword = !keyword || 
                           job.title.toLowerCase().includes(keyword) || 
                           job.company_name.toLowerCase().includes(keyword);
      return matchLocation && matchKeyword;
    });

    renderJobs(filtered);
  }

  // --- KHỞI CHẠY KHI TRANG TẢI XONG ---
  document.addEventListener('DOMContentLoaded', function() {
    // 1. Nạp header/footer động (Bạn đã fix ở bước trước)
    fetch('../components/header.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('header-container').innerHTML = html;
        if (typeof initEvents === 'function') initEvents(); 
      });

    // 2. Nạp dữ liệu Job từ Server (Thay cho dữ liệu tĩnh)
    loadJobsFromServer();
  });
</script>
  </body>
</html>
