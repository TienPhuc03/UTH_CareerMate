<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Dang nhap - Career Mate</title>
</head>
<body>
    <div class="flex min-h-screen items-center justify-center bg-slate-100 px-4">
        <div class="relative flex w-full max-w-5xl flex-col overflow-hidden rounded-3xl bg-white shadow-2xl md:flex-row">
            <div class="flex flex-1 flex-col justify-center p-8 md:p-14">
                <p class="mb-3 text-4xl font-bold text-emerald-600">Dang nhap</p>
                <p class="mb-8 text-sm font-light text-slate-500">
                    Dang nhap de quan ly CV, theo doi ung tuyen va su dung Career Mate.
                </p>

                <div id="alertMessage" class="hidden rounded-xl border px-4 py-3 text-sm"></div>

                <form id="loginForm" class="mt-6 space-y-5">
                    <div>
                        <label for="email" class="mb-2 block text-sm font-semibold text-emerald-700">Email</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="email@example.com"
                            class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100"
                            required
                        >
                    </div>

                    <div>
                        <label for="password" class="mb-2 block text-sm font-semibold text-emerald-700">Mat khau</label>
                        <div class="relative">
                            <input
                                type="password"
                                id="password"
                                placeholder="Nhap mat khau"
                                class="w-full rounded-xl border border-slate-300 px-4 py-3 pr-12 outline-none transition focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100"
                                required
                            >
                            <button
                                type="button"
                                onclick="togglePassword('password', 'eye-icon-pass')"
                                class="absolute inset-y-0 right-0 px-4 text-slate-500 transition hover:text-emerald-600"
                                aria-label="An hien mat khau"
                            >
                                <i id="eye-icon-pass" class="fa-solid fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center justify-between text-sm text-slate-500">
                        <label class="flex items-center gap-2">
                            <input type="checkbox" class="rounded border-slate-300">
                            <span>Nho dang nhap</span>
                        </label>
                        <span class="font-semibold text-emerald-600">Quen mat khau</span>
                    </div>

                    <button
                        type="submit"
                        id="submitBtn"
                        class="w-full rounded-xl bg-emerald-600 px-4 py-3 font-semibold text-white transition hover:bg-emerald-700 disabled:cursor-not-allowed disabled:bg-emerald-300"
                    >
                        Dang nhap
                    </button>
                </form>

                <button
                    type="button"
                    disabled
                    class="mt-5 flex w-full cursor-not-allowed items-center justify-center gap-3 rounded-xl border border-slate-300 px-4 py-3 text-slate-400"
                    title="Google auth se duoc mo khi backend co route OAuth hoan chinh"
                >
                    <img src="https://img.icons8.com/color/50/google-logo.png" alt="Google" class="h-6 w-6">
                    <span>Google auth sap co</span>
                </button>

                <p class="mt-8 text-center text-sm text-slate-500">
                    Chua co tai khoan?
                    <a href="signup.html" class="font-semibold text-slate-900 hover:underline">Dang ky</a>
                </p>
            </div>

            <div class="relative hidden md:block md:w-[420px]">
                <img src="../src/img/Login.jpg" alt="Career Mate" class="h-full w-full object-cover">
                <div class="absolute inset-x-6 bottom-8 rounded-2xl bg-black/35 p-6 text-white backdrop-blur-sm">
                    <p class="text-xl font-semibold">Quan ly hanh trinh nghe nghiep cua ban trong mot noi.</p>
                    <p class="mt-2 text-sm text-white/85">
                        Theo doi cong viec, tao CV va ket noi voi nha tuyen dung nhanh hon.
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000/api/Auth";

        function normalizeRole(role) {
            return role === "student" ? "candidate" : role;
        }

        function formatApiError(data) {
            if (!data) return "Khong the xu ly yeu cau luc nay.";
            if (Array.isArray(data.detail)) {
                return data.detail.map((item) => item.msg || "Du lieu khong hop le").join("; ");
            }
            return data.detail || "Dang nhap that bai.";
        }

        function showAlert(message, type) {
            const alertMessage = document.getElementById("alertMessage");
            alertMessage.className = `rounded-xl border px-4 py-3 text-sm ${
                type === "success"
                    ? "border-emerald-300 bg-emerald-50 text-emerald-700"
                    : "border-red-300 bg-red-50 text-red-700"
            }`;
            alertMessage.textContent = message;
            alertMessage.classList.remove("hidden");
        }

        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);

            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }

        document.getElementById("loginForm").addEventListener("submit", async (event) => {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const submitBtn = document.getElementById("submitBtn");
            const alertMessage = document.getElementById("alertMessage");

            submitBtn.disabled = true;
            submitBtn.textContent = "Dang xu ly...";
            alertMessage.classList.add("hidden");

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password }),
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(formatApiError(data));
                }

                const role = normalizeRole(data.role || "candidate");
                localStorage.setItem("access_token", data.access_token);
                localStorage.setItem("user_email", data.email || email);
                localStorage.setItem("user_role", role);

                showAlert("Dang nhap thanh cong. Dang chuyen huong...", "success");
                setTimeout(() => {
                    window.location.href = "../page/Homepage.html";
                }, 1000);
            } catch (error) {
                console.error("Login error:", error);
                showAlert(error.message || "Khong the ket noi toi backend.", "error");
                submitBtn.disabled = false;
                submitBtn.textContent = "Dang nhap";
            }
        });
    </script>
</body>
</html>
