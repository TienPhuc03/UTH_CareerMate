<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Dang ky - Career Mate</title>
</head>
<body>
    <div class="flex min-h-screen items-center justify-center bg-slate-100 px-4">
        <div class="relative flex w-full max-w-6xl flex-col overflow-hidden rounded-3xl bg-white shadow-2xl md:flex-row">
            <div class="flex flex-1 flex-col justify-center p-8 md:p-14">
                <p class="mb-3 text-4xl font-bold text-emerald-600">Dang ky</p>
                <p class="mb-8 text-sm font-light text-slate-500">
                    Tao tai khoan moi de quan ly CV, nop don va theo doi hanh trinh nghe nghiep.
                </p>

                <div id="alertMessage" class="hidden rounded-xl border px-4 py-3 text-sm"></div>

                <form id="signupForm" class="space-y-5">
                    <div>
                        <label for="fullName" class="mb-2 block text-sm font-semibold text-emerald-700">Ho va ten</label>
                        <input
                            type="text"
                            id="fullName"
                            name="fullName"
                            placeholder="Nguyen Van A"
                            class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100"
                            required
                        >
                    </div>

                    <div>
                        <label for="email" class="mb-2 block text-sm font-semibold text-emerald-700">Email</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="email@example.com"
                            class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100"
                            required
                        >
                    </div>

                    <div class="grid gap-5 md:grid-cols-2">
                        <div>
                            <label for="password" class="mb-2 block text-sm font-semibold text-emerald-700">Mat khau</label>
                            <div class="relative">
                                <input
                                    type="password"
                                    id="password"
                                    placeholder="It nhat 6 ky tu"
                                    class="w-full rounded-xl border border-slate-300 px-4 py-3 pr-12 outline-none transition focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100"
                                    required
                                >
                                <button
                                    type="button"
                                    onclick="togglePassword('password', 'eye-icon-pass')"
                                    class="absolute inset-y-0 right-0 px-4 text-slate-500 transition hover:text-emerald-600"
                                    aria-label="An hien mat khau"
                                >
                                    <i id="eye-icon-pass" class="fa-solid fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div>
                            <label for="confirmPassword" class="mb-2 block text-sm font-semibold text-emerald-700">Nhap lai mat khau</label>
                            <div class="relative">
                                <input
                                    type="password"
                                    id="confirmPassword"
                                    placeholder="Nhap lai mat khau"
                                    class="w-full rounded-xl border border-slate-300 px-4 py-3 pr-12 outline-none transition focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100"
                                    required
                                >
                                <button
                                    type="button"
                                    onclick="togglePassword('confirmPassword', 'eye-icon-confirm')"
                                    class="absolute inset-y-0 right-0 px-4 text-slate-500 transition hover:text-emerald-600"
                                    aria-label="An hien mat khau xac nhan"
                                >
                                    <i id="eye-icon-confirm" class="fa-solid fa-eye"></i>
                                </button>
                            </div>
                            <p id="password-match-error" class="mt-2 hidden text-sm font-medium"></p>
                        </div>
                    </div>

                    <div>
                        <p class="mb-3 text-sm font-semibold text-slate-700">Ban la ai?</p>
                        <div class="grid gap-4 md:grid-cols-2">
                            <label id="label-candidate" class="rounded-2xl border-2 border-emerald-500 bg-emerald-50 p-4 ring-2 ring-emerald-200 transition">
                                <input type="radio" name="role" value="candidate" checked class="sr-only" onchange="updateRoleUI(this)">
                                <div class="text-center">
                                    <div class="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-full bg-emerald-100 text-emerald-600">
                                        <i class="fa-solid fa-user-graduate"></i>
                                    </div>
                                    <p class="font-semibold text-slate-900">Ung vien</p>
                                    <p class="mt-1 text-xs text-slate-500">Tim viec, tao CV va nop don</p>
                                </div>
                            </label>

                            <label id="label-recruiter" class="rounded-2xl border-2 border-slate-200 p-4 transition hover:border-sky-300 hover:bg-sky-50">
                                <input type="radio" name="role" value="recruiter" class="sr-only" onchange="updateRoleUI(this)">
                                <div class="text-center">
                                    <div class="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-full bg-sky-100 text-sky-600">
                                        <i class="fa-solid fa-briefcase"></i>
                                    </div>
                                    <p class="font-semibold text-slate-900">Nha tuyen dung</p>
                                    <p class="mt-1 text-xs text-slate-500">Dang tin, quan ly ung vien</p>
                                </div>
                            </label>
                        </div>
                    </div>

                    <label class="flex items-start gap-3 text-sm text-slate-600">
                        <input type="checkbox" id="terms" class="mt-1 rounded border-slate-300" required>
                        <span>Toi dong y voi dieu khoan su dung va chinh sach cua Career Mate.</span>
                    </label>

                    <button
                        type="submit"
                        id="submitBtn"
                        class="w-full rounded-xl bg-emerald-600 px-4 py-3 font-semibold text-white transition hover:bg-emerald-700 disabled:cursor-not-allowed disabled:bg-emerald-300"
                    >
                        Tao tai khoan
                    </button>
                </form>

                <button
                    type="button"
                    disabled
                    class="mt-5 flex w-full cursor-not-allowed items-center justify-center gap-3 rounded-xl border border-slate-300 px-4 py-3 text-slate-400"
                    title="Google auth se duoc mo khi backend co route OAuth hoan chinh"
                >
                    <img src="https://img.icons8.com/color/50/google-logo.png" alt="Google" class="h-6 w-6">
                    <span>Google auth sap co</span>
                </button>

                <p class="mt-8 text-center text-sm text-slate-500">
                    Da co tai khoan?
                    <a href="login.html" class="font-semibold text-slate-900 hover:underline">Dang nhap</a>
                </p>
            </div>

            <div class="relative hidden md:block md:w-[420px]">
                <img src="../src/img/Login.jpg" alt="Career Mate" class="h-full w-full object-cover">
                <div class="absolute inset-x-6 bottom-8 rounded-2xl bg-black/35 p-6 text-white backdrop-blur-sm">
                    <p class="text-xl font-semibold">Bat dau ho so nghe nghiep cua ban ngay hom nay.</p>
                    <p class="mt-2 text-sm text-white/85">
                        Dang ky nhanh, role ro rang va san sang ket noi voi co hoi phu hop.
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000/api/Auth";

        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);

            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }

        function updateRoleUI(input) {
            const candidateCard = document.getElementById("label-candidate");
            const recruiterCard = document.getElementById("label-recruiter");

            candidateCard.className = "rounded-2xl border-2 p-4 transition";
            recruiterCard.className = "rounded-2xl border-2 p-4 transition";

            if (input.value === "candidate") {
                candidateCard.classList.add("border-emerald-500", "bg-emerald-50", "ring-2", "ring-emerald-200");
                recruiterCard.classList.add("border-slate-200", "hover:border-sky-300", "hover:bg-sky-50");
            } else {
                recruiterCard.classList.add("border-sky-500", "bg-sky-50", "ring-2", "ring-sky-200");
                candidateCard.classList.add("border-slate-200", "hover:border-emerald-300", "hover:bg-emerald-50");
            }
        }

        function validatePasswords() {
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const errorNode = document.getElementById("password-match-error");

            if (!confirmPassword) {
                errorNode.classList.add("hidden");
                return true;
            }

            if (password !== confirmPassword) {
                errorNode.textContent = "Mat khau xac nhan chua khop.";
                errorNode.className = "mt-2 text-sm font-medium text-red-600";
                return false;
            }

            errorNode.textContent = "Mat khau da khop.";
            errorNode.className = "mt-2 text-sm font-medium text-emerald-600";
            return true;
        }

        function formatApiError(data) {
            if (!data) return "Khong the xu ly yeu cau luc nay.";
            if (Array.isArray(data.detail)) {
                return data.detail.map((item) => item.msg || "Du lieu khong hop le").join("; ");
            }
            return data.detail || "Dang ky that bai.";
        }

        function showAlert(message, type) {
            const alertMessage = document.getElementById("alertMessage");
            alertMessage.className = `rounded-xl border px-4 py-3 text-sm ${
                type === "success"
                    ? "border-emerald-300 bg-emerald-50 text-emerald-700"
                    : "border-red-300 bg-red-50 text-red-700"
            }`;
            alertMessage.textContent = message;
            alertMessage.classList.remove("hidden");
        }

        document.getElementById("confirmPassword").addEventListener("input", validatePasswords);
        document.getElementById("password").addEventListener("input", validatePasswords);

        document.getElementById("signupForm").addEventListener("submit", async (event) => {
            event.preventDefault();

            if (!validatePasswords()) {
                showAlert("Vui long kiem tra lai mat khau xac nhan.", "error");
                return;
            }

            const fullName = document.getElementById("fullName").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const role = document.querySelector('input[name="role"]:checked').value;
            const submitBtn = document.getElementById("submitBtn");
            const alertMessage = document.getElementById("alertMessage");

            submitBtn.disabled = true;
            submitBtn.textContent = "Dang tao tai khoan...";
            alertMessage.classList.add("hidden");

            try {
                const response = await fetch(`${API_URL}/register`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        email,
                        password,
                        full_name: fullName,
                        role,
                    }),
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(formatApiError(data));
                }

                showAlert("Dang ky thanh cong. Ban co the dang nhap ngay.", "success");
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 1200);
            } catch (error) {
                console.error("Signup error:", error);
                showAlert(error.message || "Khong the ket noi toi backend.", "error");
                submitBtn.disabled = false;
                submitBtn.textContent = "Tao tai khoan";
            }
        });
    </script>
</body>
</html>
